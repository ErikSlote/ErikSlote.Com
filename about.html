<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Me - Erik Slote</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Playfair+Display:wght@300&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #ffffff;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }
    #lava-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    .container {
      position: relative; z-index: 100;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
    }
    .nav-directory {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 25px; z-index: 2;
    }
    .nav-item {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; color: white;
      text-decoration: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-item:hover { opacity: 0.7; transform: translateY(-2px); }
    .page-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem; color: #ffffff;
      font-weight: 100; position: absolute;
      top: 65px; left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }
    .glass-box {
      position: absolute;
      top: 130px;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      overflow-y: auto;
      color: #ffffff;
      font-size: 1.1rem;
      line-height: 1.7;
    }
    .glass-box p { margin-bottom: 20px; }
    .glass-box img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
  </style>
</head>
<body>
  <canvas id="lava-canvas"></canvas>
  <div class="container">
    <h1 class="page-title">About Me</h1>
    <div class="glass-box">
      <p>bio & photos coming soon</p>

    </div>
    <div class="nav-directory">
      <a href="index.html" class="nav-item">home</a>
      <a href="about.html" class="nav-item">about me</a>
      <a href="projects.html" class="nav-item">projects</a>
    </div>
  </div>
  <script src="lava-canvas.js"></script>
</body>
</html>
