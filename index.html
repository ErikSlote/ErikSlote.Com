<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Playfair+Display:wght@300&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>Erik Slote</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #ffffff;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    #lava-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 100;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .name {
      font-size: 4rem;
      font-family: 'Great Vibes', cursive;
      margin-bottom: 20px;
    }
    .blog-content {
      width: 60%;
      max-width: 800px;
      background: rgb(255, 255, 255);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .social-icons {
      position: absolute;
      bottom: 315px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0px;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .icon-wrap {
      display: inline-block;
      border: 0px solid #00000000;
      border-radius: 25%;
      padding: 10px;
      transition: transform 0.3s ease;
      z-index: 2;
    }
    .icon-wrap:hover {
      transform: translateY(-3px) scale(1.1);
    }
    .icon-wrap img {
      width: 25px;
      height: 25px;
      display: block;
    }

    .nav-directory {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 25px;
      z-index: 2;
    }
    .nav-item {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      color: white;
      text-transform: none;
      text-decoration: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-item:hover {
      opacity: 0.7;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="lava-canvas"></canvas>

  <div class="container">
    <div class="name">Erik Slote</div>

    <div class="nav-directory">
      <a href="index.html" class="nav-item">home</a>
      <a href="about.html" class="nav-item">about me</a>
      <a href="projects.html" class="nav-item">projects</a>
    </div>

    <div class="social-icons">
      <a href="https://x.com/erik_slote" target="_blank" class="icon-wrap">
        <img src="https://erikslote.github.io/erikslote.com/images/twitter-icon.png" alt="Twitter"/>
      </a>
      <a href="https://www.instagram.com/erikslote/" target="_blank" class="icon-wrap">
        <img src="https://erikslote.github.io/erikslote.com/images/instagram-icon.png" alt="Instagram"/>
      </a>
      <a href="https://www.linkedin.com/in/erikslote/" target="_blank" class="icon-wrap">
        <img src="https://erikslote.github.io/erikslote.com/images/linkedin-icon.png" alt="LinkedIn"/>
      </a>
    </div>
  </div>

  <script src="lava-canvas.js"></script>
</body>
</html>
