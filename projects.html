<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects - Erik Slote</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Playfair+Display:wght@300&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #ffffff;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }
    #lava-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    .container {
      position: relative; z-index: 100;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
    }
    .nav-directory {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 25px; z-index: 2;
    }
    .nav-item {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; color: white;
      text-decoration: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-item:hover { opacity: 0.7; transform: translateY(-2px); }
    .page-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem; color: #ffffff;
      font-weight: 100; position: absolute;
      top: 65px; left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }

    /* Project cards container */
    .projects-grid {
      position: absolute;
      top: 140px;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 1000px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-content: flex-start;
      overflow-y: auto;
      padding: 20px;
    }

    /* Small glass card for each project */
    .project-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 25px 30px;
      width: 280px;
      text-align: center;
      transition: transform 0.3s ease, background 0.3s ease;
      text-decoration: none;
      color: #ffffff;
    }
    .project-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.15);
    }
    .project-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      margin-bottom: 10px;
      font-weight: 300;
    }
    .project-card p {
      font-size: 0.95rem;
      opacity: 0.8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="lava-canvas"></canvas>
  <div class="container">
    <h1 class="page-title">Projects</h1>
    
    <div class="projects-grid">
      <a href="erikslote.com/mathify/" target="_blank" class="project-card">
        <h3>Case Math Practice</h3>
        <p>Practice tool for consulting interview math</p>
      </a>
    </div>

    <div class="nav-directory">
      <a href="index.html" class="nav-item">home</a>
      <a href="about.html" class="nav-item">about me</a>
      <a href="projects.html" class="nav-item">projects</a>
    </div>
  </div>
  <script src="lava-canvas.js"></script>
</body>
</html>
